  <dialog id="help-dialog" aria-labelledby="help-title"><form method="dialog"><button class="close" aria-label="閉じる">×</button></form><p class="eyebrow">HOW TO PLAY</p><h2 id="help-title">あなたの目で、確かめよう。</h2><ol><li>図形を見て、答えを選ぶ。</li><li>正解・不正解をチェック。</li><li><b>VERIFY</b>で背景を取り除き、図形を比べる。</li><li>理由を読んで、次の実験へ。</li></ol><p>全15問。「同じ」ことも、本当に違うこともあります。時間制限はありません。</p><p class="muted">色・明るさの見え方は画面や環境でも変わります。これは視覚能力を評価するテストではありません。</p></dialog>
